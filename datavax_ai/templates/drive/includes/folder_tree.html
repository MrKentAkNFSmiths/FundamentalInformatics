{% for node in nodes %}
<div>
    <a href="{% url 'drive:folder' node.folder.uuid %}" class="tree-node-row {% if node.is_active %}active{% endif %}">
        <span>{% if node.folder.is_root %}☁️{% else %}📁{% endif %}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ node.folder.name }}</span>
    </a>
    {% if node.children %}
    <div class="tree-children">
        {% include 'drive/includes/folder_tree.html' with nodes=node.children %}
    </div>
    {% endif %}
</div>
{% endfor %}
