[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]
ignore = ["RUF001", "RUF012", "SIM115", "UP037"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "accounts", "drive", "shares", "api"]
