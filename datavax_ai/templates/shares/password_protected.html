{% extends 'base.html' %}

{% block title %}Доступ ограничен — DataVax{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="auth-header">
            <div style="font-size:32px;margin-bottom:8px;">🔒</div>
            <h1>Шейр «{{ share.title }}» защищён</h1>
            <p class="muted" style="font-size:13px;">Введите пароль для просмотра и скачивания файла</p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="field-group">
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Открыть доступ</button>
        </form>
    </div>
</div>
{% endblock %}
