{% extends 'base.html' %}

{% block title %}404 — Страница не найдена | DataVax{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card" style="text-align:center;max-width:480px;">
        <div class="mono" style="font-size:64px;font-weight:700;color:var(--accent);line-height:1;">404</div>
        <h1 style="font-size:22px;margin:12px 0 8px;">Страница или файл не найдены</h1>
        <p class="muted" style="margin-bottom:20px;">
            Возможно, ссылка устарела, файл был удалён или в адресе допущена опечатка.
        </p>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
            <a href="{% url 'core:home' %}" class="btn btn-primary">На главную</a>
            <a href="{% url 'drive:root' %}" class="btn">Открыть диск</a>
        </div>
    </div>
</div>
{% endblock %}
